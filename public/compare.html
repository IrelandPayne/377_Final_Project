<html>
  <head>
    <title>Compare</title>
    <link rel="stylesheet" href="style.css" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"
    ></script>
    <script defer src="script.js"></script>
  </head>

  <body>
    <nav id="main-nav">
      <div class="nav-container">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="compare.html">Compare</a></li>
          <li><a href="country.html">Country</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="help.html">Help</a></li>
        </ul>
      </div>
    </nav>

    <div class="main-content">
      <div class="compare-top">
        <h1>Compare Countries</h1>

        <div class="compare-inputs">
          <select id="country-one">
            <option value="US">United States</option>
            <option value="CN">China</option>
            <option value="JP">Japan</option>
            <option value="DE">Germany</option>
            <option value="GB">United Kingdom</option>
            <option value="IN">India</option>
            <option value="FR">France</option>
            <option value="BR">Brazil</option>
            <option value="CA">Canada</option>
            <option value="AU">Australia</option>
          </select>

          <select id="country-two">
            <option value="CN">China</option>
            <option value="US">United States</option>
            <option value="JP">Japan</option>
            <option value="DE">Germany</option>
            <option value="GB">United Kingdom</option>
            <option value="IN">India</option>
            <option value="FR">France</option>
            <option value="BR">Brazil</option>
            <option value="CA">Canada</option>
            <option value="AU">Australia</option>
          </select>

          <select id="indicator">
            <option value="gdp">GDP</option>
            <option value="inflation">Inflation</option>
            <option value="unemployment">Unemployment Rate</option>
            <option value="life_expectancy">Life Expectancy</option>
          </select>

          <button id="compare-button">Compare</button>
        </div>
      </div>

      <div class="chart-container" id="chart-section">
        <canvas id="compare-chart"></canvas>
      </div>

      <div class="feature-box">
        <h3>Comparison Summary</h3>
        <p id="summary-text">
          Choose two countries and an indicator, then click Compare to view the
          results.
        </p>
      </div>

      <p class="footer">
        All comparison data is loaded through the backend using World Bank
        Indicators data.
      </p>
    </div>
  </body>
</html>
